site_name: MMVII — MicMac v2
site_description: Free, open-source photogrammetry suite for 3D reconstruction
site_url: https://erupnik.github.io/mmv2/
repo_url: https://github.com/micmacIGN/micmac
repo_name: micmacIGN/micmac
base_url: /mmv2 #added for erupnik
#site_url: https://micmacign.github.io/micmac/
#repo_url: https://github.com/micmacIGN/micmac
#repo_name: micmacIGN/micmac

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Building: building.md
  - Features: features.md
  - Command Reference: commands.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Coded Target Detection: tutorials/coded-targets.md
    - Aerial + Satellite Fusion: tutorials/aerial-satellite.md
    - Legacy + Modern Imagery: tutorials/legacy-modern.md
    - Industrial Metrology (CERN): tutorials/cern-metrology.md
    - Image Development & Mesh: tutorials/image-development.md
    - RPC Satellite Processing: tutorials/rpc-satellite.md
    - Topographic Survey: tutorials/topographic-survey.md
  - Python API: api.md
  - Contributing: contributing.md
  - FAQ: faq.md
  - Bibliography: bibliography.md
  - License: license.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/micmacIGN/micmac
